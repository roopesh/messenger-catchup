# CI for the PR workflow in CLAUDE.md. Branch protection isn't available on this private repo's plan,
# so these jobs are the enforcement: tests and a version bump on every PR, and a red build if a commit
# lands on main without a merged PR.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags: tests compare assets/page.html with the last release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-out
          path: tests/out
          if-no-files-found: ignore

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: VERSION must be higher than the base branch and not yet tagged
        run: |
          base=$(git show "origin/${{ github.base_ref }}:VERSION" 2>/dev/null || echo 0.0.0)
          head=$(cat VERSION)
          echo "base $base -> head $head"
          python3 -c "import sys;v=lambda s:tuple(map(int,s.strip().split('.')));sys.exit(0 if v('$head')>v('$base') else 1)" \
            || { echo "::error file=VERSION::Bump VERSION (now $head, base $base); see CLAUDE.md > Versioning"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$head" >/dev/null; then echo "::error file=VERSION::Tag v$head already exists"; exit 1; fi

  pr-only:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Every commit on main must come from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[] | select(.merged_at != null)] | length')
          if [ "$n" = "0" ]; then
            echo "::error::${{ github.sha }} reached main without a merged pull request. Every change goes through a PR (CLAUDE.md)."
            exit 1
          fi
          echo "${{ github.sha }} came from a merged PR"
