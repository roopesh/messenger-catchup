<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mock Messenger</title>
    <style>
      body {
        margin: 0;
        font: 14px system-ui;
      }
      #log {
        width: 700px;
        height: 600px;
        border: 1px solid #ccc;
      }
      #sc {
        height: 600px;
        overflow-y: auto;
      }
      .m {
        padding: 6px 10px;
        margin: 4px;
        border-radius: 8px;
        background: #eef;
      }
      .m:focus {
        outline: 2px solid orange;
      }
    </style>
  </head>
  <body>
    <div role="log" id="log"><div id="sc"></div></div>
    <script>
      /* Simulated Messenger thread: lazy-loads older messages when scrolled to the top, persists the total across reloads,
   English labels like the real UI ("X replied to Y", "Original message:", aria-label "At 5:52 PM, Name: text"). */
      const NAMES = ["Ana", "Ben", "You", "Cy", "Dee"];
      const total = () => +(localStorage.getItem("mock_total") || 120);
      const skip = () =>
        new Set(JSON.parse(localStorage.getItem("mock_skip") || "[]")); /* message numbers treated as deleted */
      function txt(i) {
        return "Message number " + i + " about trail shoes and packs";
      }
      function spec(i) {
        const f = NAMES[i % 5];
        const tm = new Date(2026, 10, 6, 9, 0 + i);
        let h = tm.getHours() % 12 || 12;
        const t = h + ":" + String(tm.getMinutes()).padStart(2, "0") + " " + (tm.getHours() < 12 ? "AM" : "PM");
        /* label forms: full date, short month (5-6), year-less date (8), unreadable (9), weekday, short weekday (15-16), Yesterday, time only */
        const tl =
          i === 8
            ? "December 28 " + t
            : i === 9
              ? "Someday " + t
              : i === 5 || i === 6
                ? "Oct 13, 2025 " + t
                : i < 10
                  ? "October 12, 2025 " + t
                  : i === 15 || i === 16
                    ? "Thu " + t
                    : i < 20
                      ? "Thursday " + t
                      : i < 25
                        ? "Yesterday " + t
                        : t;
        const o = { i, id: "mid.$mock" + i, f, t: tl, b: txt(i) };
        if (i === 26) {
          o.follow = true;
          o.b = "Mike replied to my email yesterday";
        } /* follow-on messages (no name line) whose text looks like a status line */
        if (i === 29) {
          o.follow = true;
          o.b = "You sent the wrong link btw";
        }
        if (i === 27) {
          o.b = "who deleted a message lol?";
        } /* text that mentions deleting (27 is You) */
        if (i === 24) {
          o.b = "Dee unsent a message";
        } /* Messenger's own line for an unsent message */
        if (i === 100) {
          o.photo = true;
          o.b = "";
        }
        if (i === 103) {
          o.reply = 100;
          o.photoReply = true;
          o.b = "nice pack";
        } else if (i % 7 === 0 && i > 3) {
          o.reply = i - 3;
        }
        return o;
      }
      function el(o) {
        const d = document.createElement("div");
        d.className = "m";
        d.tabIndex = 0;
        d.setAttribute("data-message-id", o.id);
        const who = o.f;
        const p = o.reply != null ? spec(o.reply) : null;
        d.setAttribute("aria-label", "At " + o.t + ", " + who + ": " + (o.b || ""));
        let lines = [];
        if (p) {
          lines.push(who + " replied to " + (p.f === "You" ? "you" : p.f));
          lines.push("Original message:");
          lines.push(o.photoReply ? "Photo" : p.b.length > 30 ? p.b.slice(0, 30) + "…" : p.b);
        } else if (who !== "You" && !o.follow) lines.push(who);
        if (o.b) lines.push(o.b);
        const t = document.createElement("div");
        t.innerText = lines.join("\n");
        d.append(t);
        if (o.photo) {
          const a = document.createElement("a");
          a.href =
            "https://www.facebook.com/messenger_media/?attachment_id=9100" +
            o.i +
            "&message_id=" +
            encodeURIComponent(o.id);
          const im = document.createElement("img");
          im.src = "/mock/fbcdn/p" + o.i + ".jpg";
          a.append(im);
          d.append(a);
        }
        if (p) {
          const g = document.createElement("div");
          g.setAttribute("aria-label", "Go to replied message");
          g.textContent = "↩";
          g.onclick = () => {
            const e = document.querySelector('[data-message-id="' + CSS.escape(p.id) + '"]');
            if (e) e.focus();
          };
          d.append(g);
        }
        return d;
      }
      const sc = document.getElementById("sc");
      let lo;
      function render() {
        sc.innerHTML = "";
        const n = total(),
          sk = skip();
        lo = Math.max(0, n - 25);
        for (let i = lo; i < n; i++) if (!sk.has(i)) sc.append(el(spec(i)));
        sc.scrollTop = sc.scrollHeight;
      }
      render();
      let loading = false;
      sc.addEventListener("scroll", () => {
        if (sc.scrollTop < 40 && lo > 0 && !loading) {
          loading = true;
          setTimeout(() => {
            const h0 = sc.scrollHeight;
            const nlo = Math.max(0, lo - 20);
            const frag = document.createDocumentFragment();
            const sk = skip();
            for (let i = nlo; i < lo; i++) if (!sk.has(i)) frag.append(el(spec(i)));
            sc.prepend(frag);
            lo = nlo;
            sc.scrollTop += sc.scrollHeight - h0;
            loading = false;
          }, 250);
        }
      });
      window.addMsgs = n => {
        const a = total();
        localStorage.setItem("mock_total", a + n);
        for (let i = a; i < a + n; i++) sc.append(el(spec(i)));
      };
    </script>
  </body>
</html>
